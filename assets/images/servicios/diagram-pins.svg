<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" width="100%" height="100%" style="background:#030f22; border-radius:6px; font-family:'Roboto',monospace,sans-serif;">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid-pins" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#0a2247" stroke-width="0.8"/>
    </pattern>
    <linearGradient id="vss-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e676" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00e676" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="terrain-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b2447" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#041226" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Grid overlay -->
  <rect width="100%" height="100%" fill="url(#grid-pins)"/>

  <!-- Topographic Obstacle Ridge Silhouette -->
  <path d="M 0 250 Q 80 180 160 210 T 300 230 Q 360 170 440 210 L 540 240 L 540 300 L 0 300 Z" fill="url(#terrain-grad)" stroke="#1e3a66" stroke-width="1"/>
  <path d="M 340 185 L 360 150 L 380 185 Z" fill="#e11d48" opacity="0.3"/>
  <line x1="360" y1="150" x2="360" y2="135" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="2,2"/>
  <text x="365" y="142" fill="#fb7185" font-size="9" font-family="monospace">OBS: 480 FT</text>

  <!-- MOC (Minimum Obstacle Clearance) Line -->
  <path d="M 60 115 L 240 160 L 360 120 L 460 190" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
  <text x="70" y="110" fill="#f59e0b" font-size="8.5" font-family="monospace">MOC PLANE (Doc 8168: 90m)</text>

  <!-- Visual Segment Surface (VSS Cone) from MAPt to Heliport -->
  <polygon points="340,165 470,222 470,238 340,175" fill="url(#vss-grad)"/>
  <text x="390" y="210" fill="#00e676" font-size="8.5" font-family="monospace" font-weight="bold">VSS 3.0° VISUAL</text>

  <!-- Flight Track (PinS Approach) -->
  <path d="M 40 60 L 170 115 L 340 170" fill="none" stroke="#00d2ff" stroke-width="2.5" filter="url(#glow-cyan)"/>
  <line x1="340" y1="170" x2="470" y2="230" stroke="#00e676" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Missed Approach Track (dashed climb) -->
  <path d="M 340 170 C 370 145 420 120 480 110" fill="none" stroke="#f97316" stroke-width="1.8" stroke-dasharray="4,3"/>
  <polygon points="485,109 475,105 477,113" fill="#f97316"/>
  <text x="410" y="125" fill="#f97316" font-size="8.5" font-family="monospace">MISSED APCH CLIMB 3000'</text>

  <!-- Fixes & Waypoints -->
  <!-- IDF Fix -->
  <circle cx="40" cy="60" r="4.5" fill="#00d2ff"/>
  <text x="45" y="55" fill="#ffffff" font-size="10" font-weight="bold">IDF (PinS)</text>
  <text x="45" y="68" fill="#94a3b8" font-size="8.5" font-family="monospace">2500 FT / 90 KIAS</text>

  <!-- Intermediate Fix -->
  <polygon points="170,110 175,115 170,120 165,115" fill="#38bdf8" stroke="#ffffff" stroke-width="1"/>
  <text x="175" y="112" fill="#ffffff" font-size="9.5" font-weight="bold">HP-INT</text>
  <text x="175" y="124" fill="#94a3b8" font-size="8.5" font-family="monospace">1600 FT</text>

  <!-- MAPt (Missed Approach Point) -->
  <circle cx="340" cy="170" r="5" fill="#ff9800" stroke="#ffffff" stroke-width="1.5"/>
  <text x="310" y="195" fill="#ffb74d" font-size="10" font-weight="bold">MAPt (PinS)</text>
  <text x="310" y="207" fill="#cbd5e1" font-size="8.5" font-family="monospace">MDA 620' · Direct-to-Heliport</text>

  <!-- Heliport FATO/TLOF Pad -->
  <g transform="translate(470, 230)">
    <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="11" fill="none" stroke="#ff9800" stroke-width="1.2" stroke-dasharray="3,2"/>
    <text x="0" y="4.5" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">H</text>
    <text x="0" y="22" fill="#38bdf8" font-size="8.5" font-weight="bold" text-anchor="middle">FATO / TLOF</text>
  </g>

  <!-- Telemetry HUD Card -->
  <g transform="translate(14, 14)">
    <rect width="180" height="38" rx="4" fill="#001833" stroke="#0284c7" stroke-width="0.8" opacity="0.9"/>
    <text x="8" y="14" fill="#38bdf8" font-size="8.5" font-weight="bold" font-family="monospace">PROC: HELIPORT PinS 08</text>
    <text x="8" y="25" fill="#e2e8f0" font-size="8" font-family="monospace">OACI Doc 8168 Vol. II · FAA 8260.42</text>
    <text x="8" y="34" fill="#4ade80" font-size="7.5" font-family="monospace">STATUS: MOC VALIDATED (WGS-84)</text>
  </g>
</svg>
