<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" width="100%" height="100%" style="background:#030f22; border-radius:6px; font-family:'Roboto',monospace,sans-serif;">
  <defs>
    <pattern id="grid-ils" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#0a2247" stroke-width="0.8"/>
    </pattern>
    <linearGradient id="llz-cone" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="gp-cone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="glow-ils" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Grid overlay -->
  <rect width="100%" height="100%" fill="url(#grid-ils)"/>

  <!-- Localizer Sector Cone (LLZ Beam ±2.5°) -->
  <polygon points="460,195 40,110 40,240" fill="url(#llz-cone)"/>
  <text x="70" y="145" fill="#38bdf8" font-size="8.5" font-family="monospace">LLZ COURSE ±2.5°</text>

  <!-- Glide Path Beam 3.0° Cone -->
  <polygon points="420,195 60,60 120,60" fill="url(#gp-cone)"/>
  <text x="140" y="85" fill="#fbbf24" font-size="8.5" font-family="monospace">GP 3.00° / TCH 50 FT</text>

  <!-- OAS Surfaces (Obstacle Assessment Surfaces under Doc 8168) -->
  <line x1="280" y1="130" x2="440" y2="180" stroke="#f43f5e" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="280" y1="210" x2="440" y2="190" stroke="#f43f5e" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="310" y="145" fill="#f43f5e" font-size="8" font-family="monospace">OAS SURFACE W/X</text>

  <!-- Runway 11L Drawing -->
  <g transform="translate(410, 185)">
    <rect x="0" y="0" width="80" height="18" fill="#1e293b" stroke="#94a3b8" stroke-width="1.2"/>
    <!-- Centerline -->
    <line x1="12" y1="9" x2="72" y2="9" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="8,5"/>
    <!-- Threshold Piano Keys -->
    <line x1="4" y1="3" x2="4" y2="15" stroke="#ffffff" stroke-width="2"/>
    <line x1="7" y1="3" x2="7" y2="15" stroke="#ffffff" stroke-width="2"/>
    <text x="-6" y="-5" fill="#ffffff" font-size="9" font-weight="bold">RWY 11L</text>
  </g>

  <!-- ILS Flight Path Trajectory -->
  <path d="M 40 75 L 180 120 L 320 162 L 415 194" fill="none" stroke="#00d2ff" stroke-width="2.5" filter="url(#glow-ils)"/>

  <!-- Outer Marker (OM) / 4.0 NM DME -->
  <circle cx="180" cy="120" r="4.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.2"/>
  <text x="180" y="105" fill="#ffffff" font-size="9.5" font-weight="bold" text-anchor="middle">OM / 4.0 DME</text>
  <text x="180" y="137" fill="#cbd5e1" font-size="8" font-family="monospace" text-anchor="middle">1600 FT (GP INT)</text>

  <!-- Middle Marker (MM) / Decision Altitude -->
  <circle cx="320" cy="162" r="4.5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.2"/>
  <text x="320" y="148" fill="#fbbf24" font-size="9.5" font-weight="bold" text-anchor="middle">MM (CAT I DA)</text>
  <text x="320" y="179" fill="#cbd5e1" font-size="8" font-family="monospace" text-anchor="middle">DA: 200 FT / RVR 550m</text>

  <!-- Holding Pattern Racetrack on Top Left -->
  <g transform="translate(70, 45)">
    <path d="M 0 0 L 35 0 C 45 0 45 18 35 18 L 0 18 C -10 18 -10 0 0 0 Z" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="3,2"/>
    <circle cx="0" cy="0" r="3" fill="#a78bfa"/>
    <text x="50" y="12" fill="#c4b5fd" font-size="8" font-family="monospace">HOLDING MHA 3000'</text>
  </g>

  <!-- Telemetry HUD Card -->
  <g transform="translate(14, 252)">
    <rect width="210" height="36" rx="4" fill="#001833" stroke="#0284c7" stroke-width="0.8" opacity="0.9"/>
    <text x="8" y="13" fill="#38bdf8" font-size="8.5" font-weight="bold" font-family="monospace">NAVAID: ILS CAT I/II/III + VOR</text>
    <text x="8" y="24" fill="#e2e8f0" font-size="8" font-family="monospace">OACI Doc 8168 Vol. II · FAA 8260.3</text>
    <text x="8" y="32" fill="#4ade80" font-size="7.5" font-family="monospace">OAS / CRM COLLISION RISK: VALIDATED</text>
  </g>
</svg>
