<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" width="100%" height="100%" style="background:#030f22; border-radius:6px; font-family:'Roboto',monospace,sans-serif;">
  <defs>
    <pattern id="grid-pbn" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#0a2247" stroke-width="0.8"/>
    </pattern>
    <linearGradient id="rnp-corridor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="glow-pbn" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Grid overlay -->
  <rect width="100%" height="100%" fill="url(#grid-pbn)"/>

  <!-- GNSS Satellites on Top Right -->
  <g transform="translate(430, 30)">
    <!-- Satellite 1 -->
    <circle cx="0" cy="0" r="4" fill="#38bdf8"/>
    <rect x="-8" y="-1.5" width="5" height="3" fill="#94a3b8"/>
    <rect x="3" y="-1.5" width="5" height="3" fill="#94a3b8"/>
    <text x="-4" y="-7" fill="#38bdf8" font-size="7.5" font-family="monospace">GNSS/SBAS</text>
    <line x1="0" y1="5" x2="-80" y2="85" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.6"/>
    <!-- Satellite 2 -->
    <circle cx="65" cy="15" r="3.5" fill="#38bdf8"/>
    <rect x="58" y="13.5" width="4" height="3" fill="#94a3b8"/>
    <rect x="68" y="13.5" width="4" height="3" fill="#94a3b8"/>
    <line x1="65" y1="20" x2="-20" y2="95" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.4"/>
  </g>

  <!-- RNP 2x Containment Corridor (99.999% Boundary) -->
  <polygon points="40,65 190,105 340,145 440,175 440,215 340,195 190,165 40,135" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,3" opacity="0.7"/>
  <text x="60" y="70" fill="#f59e0b" font-size="8" font-family="monospace">2x RNP BOUNDARY (99.999% CONTAINMENT)</text>

  <!-- RNP 1x Total System Error Corridor (95%) -->
  <polygon points="40,82 190,120 340,160 440,187 440,203 340,180 190,150 40,118" fill="url(#rnp-corridor)"/>
  <text x="70" y="110" fill="#38bdf8" font-size="8.5" font-family="monospace">RNP 0.3 NM CORRIDOR</text>

  <!-- Centerline PBN Track -->
  <path d="M 40 100 L 190 135 L 340 170 L 440 195" fill="none" stroke="#00e5ff" stroke-width="2.5" filter="url(#glow-pbn)"/>

  <!-- Runway 24 Drawing -->
  <g transform="translate(440, 187)">
    <rect x="0" y="0" width="70" height="16" fill="#1e293b" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="8" y1="8" x2="62" y2="8" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="7,4"/>
    <line x1="3" y1="2" x2="3" y2="14" stroke="#ffffff" stroke-width="2"/>
    <line x1="6" y1="2" x2="6" y2="14" stroke="#ffffff" stroke-width="2"/>
    <text x="75" y="12" fill="#ffffff" font-size="8.5" font-weight="bold">RWY 24</text>
  </g>

  <!-- ARINC 424 Waypoints -->
  <!-- IAF -->
  <polygon points="40,94 46,100 40,106 34,100" fill="#38bdf8" stroke="#ffffff" stroke-width="1.2"/>
  <text x="40" y="85" fill="#ffffff" font-size="9.5" font-weight="bold" text-anchor="middle">IAF (FLY-BY)</text>
  <text x="40" y="118" fill="#cbd5e1" font-size="8" font-family="monospace" text-anchor="middle">FL070 / 210K</text>

  <!-- IF -->
  <polygon points="190,129 196,135 190,141 184,135" fill="#38bdf8" stroke="#ffffff" stroke-width="1.2"/>
  <text x="190" y="120" fill="#ffffff" font-size="9.5" font-weight="bold" text-anchor="middle">IF (PBN)</text>
  <text x="190" y="153" fill="#cbd5e1" font-size="8" font-family="monospace" text-anchor="middle">3000 FT / TF</text>

  <!-- FAF / Maltesian Cross -->
  <g transform="translate(340, 170)">
    <path d="M -5 -5 L 0 -2 L 5 -5 L 2 0 L 5 5 L 0 2 L -5 5 L -2 0 Z" fill="#f59e0b" stroke="#ffffff" stroke-width="0.8"/>
  </g>
  <text x="340" y="155" fill="#fbbf24" font-size="9.5" font-weight="bold" text-anchor="middle">FAF (LPV / LNAV)</text>
  <text x="340" y="188" fill="#cbd5e1" font-size="8" font-family="monospace" text-anchor="middle">1800 FT · 3.00° CDA</text>

  <!-- Continuous Descent Altitude Profile (inset at bottom) -->
  <g transform="translate(40, 230)">
    <rect width="210" height="50" rx="4" fill="#001833" stroke="#0284c7" stroke-width="0.8" opacity="0.9"/>
    <text x="8" y="13" fill="#38bdf8" font-size="8" font-weight="bold" font-family="monospace">CDO CONTINUOUS DESCENT</text>
    <!-- Profile slope -->
    <line x1="12" y1="26" x2="195" y2="42" stroke="#00e5ff" stroke-width="1.8"/>
    <circle cx="12" cy="26" r="2.5" fill="#38bdf8"/>
    <circle cx="195" cy="42" r="2.5" fill="#4ade80"/>
    <text x="12" y="22" fill="#94a3b8" font-size="7" font-family="monospace">3000'</text>
    <text x="180" y="38" fill="#4ade80" font-size="7" font-family="monospace">MDA</text>
    <text x="95" y="32" fill="#e2e8f0" font-size="7" font-family="monospace">VNAV 3.00°</text>
  </g>

  <!-- Telemetry HUD Card -->
  <g transform="translate(300, 240)">
    <rect width="220" height="40" rx="4" fill="#001833" stroke="#0284c7" stroke-width="0.8" opacity="0.9"/>
    <text x="8" y="13" fill="#38bdf8" font-size="8.5" font-weight="bold" font-family="monospace">SPEC: RNP APCH (LNAV/VNAV/LPV)</text>
    <text x="8" y="24" fill="#e2e8f0" font-size="8" font-family="monospace">OACI Doc 9613 · Doc 9906 QA</text>
    <text x="8" y="34" fill="#4ade80" font-size="7.5" font-family="monospace">ARINC 424 CODING: PATH &amp; TERMINATOR</text>
  </g>
</svg>
