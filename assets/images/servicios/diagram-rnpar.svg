<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" width="100%" height="100%" style="background:#030f22; border-radius:6px; font-family:'Roboto',monospace,sans-serif;">
  <defs>
    <pattern id="grid-rnpar" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#0a2247" stroke-width="0.8"/>
    </pattern>
    <radialGradient id="mountain-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#e11d48" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow-rnpar" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Grid overlay -->
  <rect width="100%" height="100%" fill="url(#grid-rnpar)"/>

  <!-- Critical Mountain Terrain Obstacle (Bypassed by curved RF leg) -->
  <g transform="translate(235, 110)">
    <!-- Mountain contour rings -->
    <circle cx="0" cy="0" r="65" fill="url(#mountain-glow)"/>
    <path d="M -45 15 Q -10 -40 25 -30 Q 55 -10 40 25 Q 10 45 -45 15 Z" fill="#0f172a" stroke="#e11d48" stroke-width="1.2" opacity="0.8"/>
    <path d="M -25 10 Q -5 -25 15 -18 Q 30 -5 22 15 Q 5 28 -25 10 Z" fill="#1e1b4b" stroke="#f43f5e" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="3" fill="#f43f5e"/>
    <text x="0" y="-10" fill="#f43f5e" font-size="9" font-weight="bold" text-anchor="middle">CRITICAL PEAK</text>
    <text x="0" y="4" fill="#fb7185" font-size="8" font-family="monospace" text-anchor="middle">ELEV: 3840 FT</text>
  </g>

  <!-- RF Leg Center of Arc & Radius Line -->
  <circle cx="150" cy="210" r="3" fill="#a855f7"/>
  <text x="150" y="224" fill="#c084fc" font-size="8" font-family="monospace" text-anchor="middle">RF CENTER FIX</text>
  <!-- Radius lines -->
  <line x1="150" y1="210" x2="80" y2="100" stroke="#a855f7" stroke-width="0.9" stroke-dasharray="3,3" opacity="0.6"/>
  <line x1="150" y1="210" x2="330" y2="175" stroke="#a855f7" stroke-width="0.9" stroke-dasharray="3,3" opacity="0.6"/>
  <path d="M 120 160 A 60 60 0 0 1 200 195" fill="none" stroke="#a855f7" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="175" y="180" fill="#d8b4fe" font-size="8" font-family="monospace">R = 2.45 NM</text>

  <!-- Tight RNP 0.10 NM Containment Walls (dashed) -->
  <path d="M 40 62 L 76 96 A 140 140 0 0 1 326 168 L 416 177" fill="none" stroke="#f59e0b" stroke-width="0.9" stroke-dasharray="3,3" opacity="0.6"/>
  <path d="M 40 78 L 84 104 A 120 120 0 0 1 334 182 L 424 191" fill="none" stroke="#f59e0b" stroke-width="0.9" stroke-dasharray="3,3" opacity="0.6"/>
  <text x="60" y="55" fill="#f59e0b" font-size="7.5" font-family="monospace">RNP 0.10 NM (185m) CORRIDOR</text>

  <!-- Curved RF Track (Radius-to-Fix Arc) -->
  <path d="M 40 70 L 80 100 A 130 130 0 0 1 330 175 L 420 184" fill="none" stroke="#00e5ff" stroke-width="2.8" filter="url(#glow-rnpar)"/>

  <!-- Engine-Out Missed Approach Contingency (dashed pink) -->
  <path d="M 230 140 C 270 190 320 230 400 240" fill="none" stroke="#ec4899" stroke-width="1.8" stroke-dasharray="4,3"/>
  <polygon points="405,240 395,236 397,244" fill="#ec4899"/>
  <text x="280" y="225" fill="#f472b6" font-size="8" font-family="monospace">EO MISSED APCH CLIMB</text>

  <!-- Runway 18 Drawing -->
  <g transform="translate(420, 175)">
    <rect x="0" y="0" width="70" height="18" fill="#1e293b" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="8" y1="9" x2="62" y2="9" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="7,4"/>
    <line x1="3" y1="2" x2="3" y2="16" stroke="#ffffff" stroke-width="2"/>
    <line x1="6" y1="2" x2="6" y2="16" stroke="#ffffff" stroke-width="2"/>
    <text x="75" y="13" fill="#ffffff" font-size="8.5" font-weight="bold">RWY 18</text>
  </g>

  <!-- Waypoints -->
  <!-- RF Start Waypoint -->
  <polygon points="80,94 86,100 80,106 74,100" fill="#38bdf8" stroke="#ffffff" stroke-width="1.2"/>
  <text x="80" y="88" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">RF-START</text>
  <text x="80" y="118" fill="#cbd5e1" font-size="7.5" font-family="monospace" text-anchor="middle">BANK 18°</text>

  <!-- RF End / Roll-out Waypoint -->
  <polygon points="330,169 336,175 330,181 324,175" fill="#f59e0b" stroke="#ffffff" stroke-width="1.2"/>
  <text x="330" y="162" fill="#fbbf24" font-size="9" font-weight="bold" text-anchor="middle">RF-END (FN18)</text>
  <text x="330" y="193" fill="#cbd5e1" font-size="7.5" font-family="monospace" text-anchor="middle">DA 280 FT</text>

  <!-- Telemetry HUD Card -->
  <g transform="translate(14, 245)">
    <rect width="215" height="42" rx="4" fill="#001833" stroke="#0284c7" stroke-width="0.8" opacity="0.9"/>
    <text x="8" y="13" fill="#38bdf8" font-size="8.5" font-weight="bold" font-family="monospace">PROC: RNP AR APCH (AUTH REQ)</text>
    <text x="8" y="24" fill="#e2e8f0" font-size="8" font-family="monospace">TRAMOS RF · RNP 0.10 NM · Doc 9905</text>
    <text x="8" y="34" fill="#4ade80" font-size="7.5" font-family="monospace">TERRAIN CLEARANCE: BYPASSED VIA RF ARC</text>
  </g>
</svg>
